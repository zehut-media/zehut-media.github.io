<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ZEHUT creative agency, Jerusalem. Films for fashion, real estate, events, food and proposals.">
<title>ZEHUT</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap"><style>
/* Layout: one washi-paper canvas, Japanese restraint (ma). Wordmark bottom-left, vertical tag top-right,
   typewritten category notes that drift with the cursor at different depths. An ink dot follows the pointer.
   A category opens a quiet staggered reel wall. Single light look by design. */
:root{
  --paper:#fbfaf7;--ink:#111111;--soft:#9a9a94;--hair:#e6e4de;--tile:#f1efea;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --type:"Courier Prime","Courier New",Courier,ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background-color:var(--paper);background-attachment:fixed;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

.mark{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 1.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);font-weight:500;font-size:clamp(64px,15vw,230px);letter-spacing:-.05em;line-height:.8;z-index:3}
.tag{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 1.5vw);top:calc(env(safe-area-inset-top,0px) + 4vh);writing-mode:vertical-rl;font-family:var(--type);font-size:12px;letter-spacing:.28em;z-index:3}
.coord{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 1.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + 3.4vh);font-family:var(--type);font-size:11px;letter-spacing:.08em;color:var(--soft);text-align:right;line-height:1.7;z-index:3}

.home{position:fixed;inset:0}
.cat{position:absolute;font-family:var(--type);font-size:14px;letter-spacing:.04em;text-transform:lowercase;padding:6px 0;display:flex;align-items:baseline;gap:10px;transition:opacity .4s ease;will-change:transform}
.cat i{font-style:normal;font-size:10px;color:var(--soft)}
.cat::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.cat:hover::after,.cat:focus-visible::after{transform:scaleX(1)}
.home:has(.cat:hover) .cat:not(:hover){opacity:.18}

.p1{top:20%;left:13%}
.p2{top:12%;left:50%}
.p3{top:38%;left:67%}
.p4{top:53%;left:32%}
.p5{top:67%;left:70%}
@media (max-width:640px){
  .p1{top:17%;left:9%}
  .p2{top:29%;left:55%}
  .p3{top:41%;left:17%}
  .p4{top:53%;left:50%}
  .p5{top:64%;left:9%}
  .coord{display:none}
}

.dot{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:9;transition:width .35s ease,height .35s ease,margin .35s ease,background .35s ease,border-color .35s ease;border:1px solid transparent}
.dot.big{width:44px;height:44px;margin:-22px 0 0 -22px;background:transparent;border-color:var(--ink)}
@media (hover:none),(pointer:coarse){.dot{display:none}}

.wall{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16vh 46vh}
.wall-head{display:flex;align-items:baseline;gap:16px;max-width:1040px;margin:0 auto 9vh;font-family:var(--type);border-bottom:1px solid var(--hair);padding-bottom:14px}
.wall-head h2{margin:0;font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:lowercase}
.wall-head span{color:var(--soft);font-size:11px}
.back{font-size:11px;color:var(--soft);margin-left:auto;letter-spacing:.06em}
.back:hover{color:var(--ink)}
.reels{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6vw 4vw}
.reels .r:nth-child(3n+2){transform:translateY(12vh)}
.reels .r:nth-child(3n){transform:translateY(4vh)}
@media (max-width:640px){.reels{grid-template-columns:1fr 1fr;gap:28px 16px}.reels .r:nth-child(n){transform:none}.reels .r:nth-child(2n){transform:translateY(48px)}}
.r{min-width:0}
.box{aspect-ratio:9/16;max-width:100%;background:var(--tile);position:relative;overflow:hidden}
.box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.box video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:18px;background:var(--ink);color:var(--paper);font-family:var(--type);transition:background .4s ease}
.pv:hover{background:#2a2a2a}
.pv-t{font-size:clamp(16px,2vw,22px);letter-spacing:.02em}
.pv-p{font-size:11px;letter-spacing:.12em;opacity:.75}
.box .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--soft);font-family:var(--type);font-size:11px;letter-spacing:.1em}
.r p{margin:10px 0 0;font-family:var(--type);font-size:11px;letter-spacing:.04em;color:var(--ink);display:flex;gap:10px}
.r p i{font-style:normal;color:var(--soft)}

/* Collage: tiles placed by hand-tuned slots, overlapping, the one you touch rises to the top. */
.reels.collage{display:block;position:relative;max-width:1040px;margin:0 auto}
.reels.collage .r{position:absolute;transform:none!important;transition:box-shadow .4s ease}
.reels.collage .r .box{box-shadow:0 1px 0 var(--hair),0 18px 40px -24px rgba(40,35,25,.35)}
.reels.collage .r:hover,.reels.collage .r:focus-within{z-index:20!important}
.reels.collage .r p{background:var(--paper);display:inline-flex;padding:4px 8px 4px 0}
body.in-wall .tag,body.in-wall .coord{opacity:0;visibility:hidden}
.tag,.coord{transition:opacity .4s ease,visibility .4s}

[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .7s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>
<style>body{margin:0}</style>
</head>
<body>

<a class="mark" href="#" aria-label="ZEHUT, home">ZEHUT</a>
<div class="tag">creative agency</div>
<div class="coord">jerusalem<br>31.77° n · 35.21° e</div>
<div class="dot" id="dot" aria-hidden="true"></div>

<main id="home" class="home view" aria-label="Categories"></main>
<section id="wall" class="wall view" hidden></section>

<script>
/* Edit here: order on the page follows this list. Each video takes ONE of:
   youtube:"dQw4w9WgXcQ" (the 11 characters after v= or after youtu.be/),
   id:"123456789" (a Vimeo number), or src:"https://.../film.mp4" (a direct video file).
   Nothing filled = example tile. */
var CATS=[
  {key:"fashion",name:"Fashion",videos:[{id:"1241057121",title:"Maneland"}]},
  {key:"realestate",name:"Real Estate",videos:[{id:"",title:"New project, Jerusalem"},{id:"",title:"Penthouse tour"},{id:"",title:"Site progress"}]},
  {key:"events",name:"Events",videos:[{id:"",title:"Product launch"},{id:"",title:"Gala night"},{id:"",title:"Conference recap"}]},
  {key:"food",name:"Food",videos:[{id:"",title:"Chef's table"},{id:"",title:"Bakery morning"},{id:"",title:"Street food"}]},
  {key:"proposals",name:"Proposals",videos:[{id:"",title:"Rooftop, Jerusalem"},{id:"",title:"Old City at dawn"},{id:"",title:"Sea of Galilee"}]}
];
var DEPTH=[1.0,0.45,0.8,0.3,0.65];
/* Free Vimeo: false. After upgrading to a paid Vimeo plan, set true for frameless background playback. */
var VIMEO_PAID=false;
/* Inside the Claude preview, outside players are blocked: show a designed tile that links out instead. */
var PREVIEW=/claude/i.test(location.hostname);
var home=document.getElementById('home'),wall=document.getElementById('wall'),dot=document.getElementById('dot');
function pad(n){return n<10?'0'+n:''+n}
function el(t,a,txt){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}

/* Washi paper: fine grain plus a few long faint fibers, drawn once into a tile. */
(function paper(){
  try{
    var s=320,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
    var img=x.createImageData(s,s),d=img.data;
    for(var i=0;i<d.length;i+=4){var v=Math.random();var a=v<.5?Math.round(v*22):Math.round((1-v)*10);var tone=v<.5?60:255;d[i]=tone;d[i+1]=tone-4;d[i+2]=tone-12;d[i+3]=a}
    x.putImageData(img,0,0);
    x.lineCap='round';
    for(var f=0;f<38;f++){
      x.strokeStyle='rgba(120,110,95,'+(0.035+Math.random()*0.05)+')';x.lineWidth=.4+Math.random()*.6;
      var sx=Math.random()*s,sy=Math.random()*s,l=20+Math.random()*70,ang=Math.random()*Math.PI*2;
      x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(sx+Math.cos(ang+.6)*l*.5,sy+Math.sin(ang+.6)*l*.5,sx+Math.cos(ang)*l,sy+Math.sin(ang)*l);x.stroke();
    }
    document.body.style.backgroundImage='url('+c.toDataURL('image/png')+')';
  }catch(e){}
})();

CATS.forEach(function(c,i){
  var a=el('a',{class:'cat p'+(i+1),href:'#'+c.key});
  a.appendChild(el('i',{},pad(i+1)));
  a.appendChild(document.createTextNode(c.name));
  home.appendChild(a);
});
var cats=[].slice.call(home.querySelectorAll('.cat'));

/* Motion: categories drift against the pointer at different depths; an ink dot trails the cursor. */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tx=0,ty=0,cx=0,cy=0,mx=-100,my=-100,dx=-100,dy=-100;
window.addEventListener('pointermove',function(e){
  mx=e.clientX;my=e.clientY;
  tx=(e.clientX/window.innerWidth-.5)*2;ty=(e.clientY/window.innerHeight-.5)*2;
  var t=e.target;dot.classList.toggle('big',!!(t&&t.closest&&t.closest('a')));
},{passive:true});
document.addEventListener('pointerleave',function(){tx=ty=0;mx=my=-100});
function tick(){
  cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
  dx+=(mx-dx)*.2;dy+=(my-dy)*.2;
  if(!reduce&&!home.hidden){for(var i=0;i<cats.length;i++){var k=DEPTH[i%DEPTH.length]*22;cats[i].style.transform='translate3d('+(-cx*k).toFixed(2)+'px,'+(-cy*k).toFixed(2)+'px,0)'}}
  dot.style.transform='translate3d('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px,0)';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function showWall(c){
  wall.textContent='';
  var head=el('div',{class:'wall-head'});
  head.appendChild(el('h2',{},c.name));
  head.appendChild(el('span',{},pad(c.videos.length)+' films'));
  head.appendChild(el('a',{class:'back',href:'#'},'← back'));
  wall.appendChild(head);
  var grid=el('div',{class:'reels'});
  c.videos.forEach(function(v,i){
    var r=el('div',{class:'r'}),box=el('div',{class:'box'});
    if(v.src){
      box.appendChild(el('video',{src:v.src,autoplay:'',muted:'',loop:'',playsinline:'',preload:'metadata'}));
      box.lastChild.muted=true;
    }else if(/^[\w-]{11}$/.test(v.youtube||'')){
      box.appendChild(el('iframe',{src:'https://www.youtube-nocookie.com/embed/'+v.youtube+'?autoplay=1&mute=1&loop=1&playlist='+v.youtube+'&controls=0&playsinline=1&rel=0&modestbranding=1',allow:'autoplay; fullscreen; picture-in-picture',title:v.title,loading:'lazy'}));
    }else if(/^\d+$/.test(v.id||'')&&PREVIEW){
      var pv=el('a',{class:'pv',href:'https://vimeo.com/'+v.id,target:'_blank',rel:'noopener'});
      pv.appendChild(el('span',{class:'pv-t'},v.title.toLowerCase()));
      pv.appendChild(el('span',{class:'pv-p'},'▶ play on vimeo'));
      box.appendChild(pv);
    }else if(/^\d+$/.test(v.id||'')){
      box.appendChild(el('iframe',{src:'https://player.vimeo.com/video/'+v.id+(VIMEO_PAID?'?background=1&':'?')+'autoplay=1&loop=1&muted=1&title=0&byline=0&portrait=0&dnt=1',allow:'autoplay; fullscreen; picture-in-picture',title:v.title,loading:'lazy'}));
    }else{
      box.appendChild(el('div',{class:'ph'},'example'));
    }
    r.appendChild(box);
    var p=el('p');p.appendChild(el('i',{},pad(i+1)));p.appendChild(document.createTextNode(v.title.toLowerCase()));
    r.appendChild(p);
    grid.appendChild(r);
  });
  grid.classList.add('collage');
  wall.appendChild(grid);
  layout();
}

/* Collage slots: left, top and width in % of the wall's width; height follows 9:16.
   Fixed, so every visit shows the same composition. Overlaps are deliberate. */
var SLOTS=[
  {l:3,t:0,w:34,z:2},{l:31,t:30,w:26,z:4},{l:62,t:4,w:30,z:1},
  {l:55,t:50,w:27,z:5},{l:10,t:64,w:29,z:3},{l:68,t:100,w:24,z:2},
  {l:34,t:112,w:27,z:4},{l:4,t:128,w:25,z:1},{l:60,t:150,w:30,z:3}
];
var SLOTS_PHONE=[
  {l:0,t:0,w:58,z:2},{l:40,t:48,w:56,z:3},{l:4,t:102,w:52,z:1},
  {l:44,t:146,w:54,z:4},{l:0,t:196,w:56,z:2},{l:42,t:244,w:54,z:3}
];
function layout(){
  var g=wall.querySelector('.reels.collage');if(!g)return;
  var W=g.clientWidth,phone=W<560,S=phone?SLOTS_PHONE:SLOTS,n=S.length,bottom=0;
  var tiles=g.querySelectorAll('.r');
  for(var i=0;i<tiles.length;i++){
    var s=S[i%n],round=Math.floor(i/n),step=phone?300:190;
    var top=(s.t+round*step)*W/100,w=s.w*W/100,h=w*16/9;
    var r=tiles[i];r.style.left=(s.l*W/100)+'px';r.style.top=top+'px';r.style.width=w+'px';r.style.zIndex=s.z;
    bottom=Math.max(bottom,top+h+40);
  }
  g.style.height=bottom+'px';
}
window.addEventListener('resize',layout);

function route(){
  var k=location.hash.slice(1),c=null;
  for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)c=CATS[i];
  if(c){showWall(c);home.hidden=true;wall.hidden=false;document.body.classList.add('in-wall');layout();window.scrollTo(0,0)}
  else{wall.hidden=true;home.hidden=false;document.body.classList.remove('in-wall')}
}
window.addEventListener('hashchange',route);
route();
</script>

</body>
</html>
