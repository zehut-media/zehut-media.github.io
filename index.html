<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="ZEHUT, a creative studio for brand storytelling, visual content and digital presence. Israel and the US.">
<title>ZEHUT</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Cousine&display=swap"><style>
/* Layout: one washi-paper canvas, Japanese restraint (ma). Wordmark bottom-left, vertical tag top-right,
   language switch top-left, about bottom-right, typewritten category notes placed loosely in reading order.
   A category opens a quiet overlapping collage. Single light look by design. */
:root{
  --paper:#fbfaf7;--ink:#111111;--soft:#9a9a94;--hair:#e6e4de;--tile:#f1efea;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --type:"Courier Prime","Cousine","Courier New",Courier,ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background-color:var(--paper);background-attachment:fixed;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
[hidden]{display:none!important}

.mark{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 1.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);font-weight:500;font-size:clamp(64px,15vw,230px);letter-spacing:-.05em;line-height:.8;z-index:3;direction:ltr}
.tag{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 1.5vw);top:calc(env(safe-area-inset-top,0px) + 4vh);writing-mode:vertical-rl;font-family:var(--type);font-size:12px;letter-spacing:.28em;z-index:3}
.coord{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 1.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + 3.4vh + 34px);font-family:var(--type);font-size:11px;letter-spacing:.08em;color:var(--soft);text-align:right;line-height:1.7;z-index:3}
.about-link{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 1.5vw);bottom:calc(env(safe-area-inset-bottom,0px) + 3.4vh);font-family:var(--type);font-size:12px;letter-spacing:.14em;text-transform:lowercase;z-index:6;padding:6px 0}
.lang{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 1.5vw);top:calc(env(safe-area-inset-top,0px) + 4vh);z-index:6;background:none;border:0;padding:6px 0;font-family:var(--type);font-size:12px;letter-spacing:.14em;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.lang span{color:var(--soft);transition:color .3s}
.lang span.on{color:var(--ink)}
.about-link::after,.lang::after,.cat::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:var(--ink);transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.about-link::after{transform-origin:right}.lang::after,.cat::after{transform-origin:left}
.about-link:hover::after,.lang:hover::after,.cat:hover::after,.cat:focus-visible::after{transform:scaleX(1)}
.tag,.coord{transition:opacity .4s ease,visibility .4s}
body.in-wall .tag,body.in-wall .coord,body.in-about .tag,body.in-about .coord{opacity:0;visibility:hidden}

.home{position:fixed;inset:0}
.cat{position:absolute;font-family:var(--type);font-size:14px;letter-spacing:.04em;text-transform:lowercase;padding:6px 0;display:flex;align-items:baseline;gap:10px;transition:opacity .4s ease;will-change:transform;white-space:nowrap}
.cat i{font-style:normal;font-size:10px;color:var(--soft)}
.home:has(.cat:hover) .cat:not(:hover){opacity:.18}
/* Reading order runs 01 to 06 top to bottom in a loose zigzag. */
.p1{top:15%;left:14%}
.p2{top:24%;left:50%}
.p3{top:37%;left:73%}
.p4{top:47%;left:27%}
.p5{top:59%;left:55%}
.p6{top:70%;left:76%}
@media (max-width:640px){
  .p1{top:15%;left:8%}
  .p2{top:25%;left:46%}
  .p3{top:35%;left:14%}
  .p4{top:45%;left:52%}
  .p5{top:55%;left:10%}
  .p6{top:65%;left:44%}
  .coord{display:none}
  .home{touch-action:none}
}

.dot{position:fixed;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:60;transition:width .35s ease,height .35s ease,margin .35s ease,background .35s ease,border-color .35s ease;border:1px solid transparent}
.dot.big{width:44px;height:44px;margin:-22px 0 0 -22px;background:transparent;border-color:var(--ink)}
@media (hover:none),(pointer:coarse){.dot{display:none}}

.wall{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16vh 46vh}
.wall-head{display:flex;align-items:baseline;gap:16px;max-width:1040px;margin:0 auto 9vh;font-family:var(--type);border-bottom:1px solid var(--hair);padding-bottom:14px}
.wall-head h2{margin:0;font-weight:400;font-size:15px;letter-spacing:.06em;text-transform:lowercase}
.wall-head span{color:var(--soft);font-size:11px}
.back{font-size:11px;color:var(--soft);margin-inline-start:auto;letter-spacing:.06em}
.back:hover{color:var(--ink)}
.reels.collage{display:block;position:relative;max-width:1040px;margin:0 auto}
.reels.collage .r{position:absolute;min-width:0;transform:translate3d(var(--px,0px),var(--py,0px),0);will-change:transform}
.reels.collage .r:hover,.reels.collage .r:focus-within{z-index:20!important}
.box{aspect-ratio:9/16;max-width:100%;background:var(--tile);position:relative;overflow:hidden;box-shadow:0 1px 0 var(--hair),0 18px 40px -24px rgba(40,35,25,.35);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s ease}
.box.tilt{transition:transform .12s linear,box-shadow .5s ease;box-shadow:0 1px 0 var(--hair),0 30px 60px -28px rgba(40,35,25,.45)}
.box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.box.playing{z-index:30}
.box.playing .thumb{display:none}
.thumb{position:absolute;inset:0;border:0;padding:0;margin:0;background:var(--tile);cursor:pointer;display:block;width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.thumb img.in{opacity:1}
.thumb:hover img{transform:scale(1.03)}
.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:12px;display:flex;align-items:center;justify-content:center;padding-left:2px;opacity:.92;transition:transform .25s ease}
.thumb:active .play{transform:translate(-50%,-50%) scale(.88)}
.r p{position:absolute;left:0;bottom:0;margin:0;z-index:2;background:var(--paper);display:inline-flex;gap:10px;padding:4px 8px;font-family:var(--type);font-size:11px;letter-spacing:.04em}
.r p i{font-style:normal;color:var(--soft)}
@media (prefers-reduced-motion:no-preference){
  .reels.collage .box{animation:drop .9s cubic-bezier(.2,.7,.2,1) backwards}
  .reels.collage .r:nth-child(2) .box{animation-delay:.08s}.reels.collage .r:nth-child(3) .box{animation-delay:.16s}
  .reels.collage .r:nth-child(4) .box{animation-delay:.24s}.reels.collage .r:nth-child(5) .box{animation-delay:.32s}
  .reels.collage .r:nth-child(6) .box{animation-delay:.4s}.reels.collage .r:nth-child(n+7) .box{animation-delay:.48s}
  @keyframes drop{from{transform:translateY(18px) rotate(-1.2deg) scale(.97)}}
  .view{animation:fade .7s ease both}@keyframes fade{from{opacity:0}}
}

/* About: a small particle portrait beside a few typewritten lines. */
.about{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12vh 24vh;position:relative;z-index:4}
.about-grid{display:flex;flex-direction:column;align-items:center;gap:44px;max-width:32rem;margin:0 auto;text-align:center}
.figure{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
#avatar{display:block;width:120px;height:120px;border-radius:50%;object-fit:cover;filter:grayscale(1);box-shadow:0 0 0 1px var(--hair)}
.figure span{font-family:var(--type);font-size:10px;letter-spacing:.1em;color:var(--soft)}
.about-in{width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:20px;font-family:var(--type)}
.about-in h2{margin:0;font-weight:400;font-size:11px;letter-spacing:.16em;color:var(--soft)}
.about-in p{margin:0;font-size:15px;line-height:1.75;letter-spacing:.01em;text-wrap:pretty}
#aboutText{display:flex;flex-direction:column;gap:14px}
.mark{transition:opacity .5s ease}
body.in-about .mark{opacity:.1}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:16px;border-top:1px solid var(--hair);font-size:12px;letter-spacing:.06em;width:min(100%,16rem)}
.contact small{font-size:11px;color:var(--soft);letter-spacing:.12em}
.contact a{position:relative;padding:2px 0;direction:ltr;border-bottom:1px solid var(--hair);transition:border-color .4s}
.contact a:hover{border-color:var(--ink)}
@media (max-width:640px){.about{padding-block:12vh 30vh}.about-grid{gap:36px}#avatar{width:104px;height:104px}}

html[lang="he"] .about-in,html[lang="he"] .wall-head{direction:rtl}
html[lang="he"] .cat{letter-spacing:.02em}
</style>
<style>body{margin:0}</style>
</head>
<body>

<a class="mark" href="#" aria-label="ZEHUT, home">ZEHUT</a>
<div class="tag" id="tag">creative agency</div>
<button class="lang" id="lang" type="button" aria-label="Switch language"><span data-l="en">en</span><span data-l="he">עב</span></button>
<div class="coord" id="coord">jerusalem<br>31.77° n · 35.21° e</div>
<a class="about-link" id="aboutLink" href="#about">about</a>
<div class="dot" id="dot" aria-hidden="true"></div>

<main id="home" class="home view" aria-label="Categories"></main>
<section id="wall" class="wall view" hidden></section>
<section id="about" class="about view" hidden aria-label="About">
  <div class="about-grid">
    <div class="figure"><img id="avatar" src="avatar.jpg" alt="Shraga Hollander" width="120" height="120"><span id="figcap">shraga hollander</span></div>
    <div class="about-in">
      <h2 id="aboutH">about</h2>
      <div id="aboutText"></div>
      <div class="contact"><small id="contactH">contact</small><span id="waLabel">whatsapp</span><a id="wa" href="https://wa.me/972586487601" target="_blank" rel="noopener">+972 58-648-7601</a></div>
    </div>
  </div>
</section>

<script>
/* Edit here: the page follows this order. Each video is a Vimeo number; title "" shows no caption.
   Titles show in English only. */
var CATS=[
  {key:"fashion",en:"Fashion",he:"אופנה",videos:[{id:"1241057121",title:"Maneland"},{id:"1241864988"},{id:"1241864676"},{id:"1241864755"},{id:"1241864840"}]},
  {key:"realestate",en:"Real Estate",he:"נדל״ן",videos:[{id:"1241270552"},{id:"1241270714"},{id:"1241270204"},{id:"1241270283"},{id:"1241270416"},{id:"1241270997"},{id:"1241271146"},{id:"1241270881"}]},
  {key:"events",en:"Events",he:"אירועים",videos:[{id:"1241272626",title:"NYC"},{id:"1241272502",title:"HASC"},{id:"1241280526",title:"HASC II"},{id:"1241280184",title:"YAMA"},{id:"1241273655",title:"Production"},{id:"1241865790"},{id:"1241866076"},{id:"1241865951"},{id:"1241866301"}]},
  {key:"food",en:"Food",he:"אוכל",videos:[{id:"1241282031",title:"REN"},{id:"1241281237",title:"Drink"},{id:"1241281381",title:"Dish"},{id:"1241281839",title:"Fish"},{id:"1241281619",title:"Dining"},{id:"1241281096",title:"Sol Dining"},{id:"1241866413"},{id:"1241865857"}]},
  {key:"proposals",en:"Proposals",he:"הצעות נישואין",videos:[{id:"1241861965"},{id:"1241861532"},{id:"1241861385"},{id:"1241865544"},{id:"1241865635"},{id:"1241865444"}]},
  {key:"brand",en:"Brand Content",he:"תוכן שיווקי",videos:[{id:"1241865214"},{id:"1241865341"},{id:"1241865111"}]}
];
/* Paused for now (Event Art): {key:"eventart",en:"Event Art",he:"אמנות אירועים",videos:[{id:"1241273938"},{id:"1241273386"}]} */

var T={
  en:{tag:"creative agency",coord:"jerusalem<br>31.77° n · 35.21° e",about:"about",close:"close",aboutH:"about",films:" films",back:"← back",
      text:["ZEHUT is a creative studio focused on brand storytelling, visual content, and digital presence.","I work with businesses to turn ideas into compelling stories through strategy, creative direction, and film.","Based in Israel, working with brands in Israel and the US.","I believe every business has a story worth telling. My job is to find the right way to tell it."],
      cap:"shraga hollander",contactH:"contact",wa:"whatsapp"},
  he:{tag:"סטודיו לתוכן",coord:"ירושלים<br>31.77° n · 35.21° e",about:"אודות",close:"סגירה",aboutH:"אודות",films:" סרטים",back:"חזרה →",
      text:["ZEHUT הוא סטודיו קריאייטיב שמתמקד בסיפור מותג, בתוכן ויזואלי ובנוכחות דיגיטלית.","אני עובד עם עסקים והופך רעיונות לסיפורים שתופסים, דרך אסטרטגיה, הכוונה קריאייטיבית ווידאו.","מבוסס בישראל, ועובד עם מותגים בישראל ובארצות הברית.","אני מאמין שלכל עסק יש סיפור ששווה לספר. התפקיד שלי הוא למצוא את הדרך הנכונה לספר אותו."],
      cap:"שרגא הולנדר",contactH:"צרו קשר",wa:"וואטסאפ"}
};
var LANG='en';
try{var saved=localStorage.getItem('zehut-lang');if(saved==='he'||saved==='en')LANG=saved}catch(e){}

var DEPTH=[1.0,0.45,0.8,0.3,0.65,0.55];
var home=document.getElementById('home'),wall=document.getElementById('wall'),dot=document.getElementById('dot');
function pad(n){return n<10?'0'+n:''+n}
function el(t,a,txt){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
function nameOf(c){return c[LANG]}

/* Washi paper: fine grain plus a few long faint fibers, drawn once into a tile. */
(function paper(){
  try{
    var s=320,c=document.createElement('canvas');c.width=c.height=s;var x=c.getContext('2d');
    var img=x.createImageData(s,s),d=img.data;
    for(var i=0;i<d.length;i+=4){var v=Math.random();var a=v<.5?Math.round(v*22):Math.round((1-v)*10);var tone=v<.5?60:255;d[i]=tone;d[i+1]=tone-4;d[i+2]=tone-12;d[i+3]=a}
    x.putImageData(img,0,0);x.lineCap='round';
    for(var f=0;f<38;f++){
      x.strokeStyle='rgba(120,110,95,'+(0.035+Math.random()*0.05)+')';x.lineWidth=.4+Math.random()*.6;
      var sx=Math.random()*s,sy=Math.random()*s,l=20+Math.random()*70,ang=Math.random()*Math.PI*2;
      x.beginPath();x.moveTo(sx,sy);x.quadraticCurveTo(sx+Math.cos(ang+.6)*l*.5,sy+Math.sin(ang+.6)*l*.5,sx+Math.cos(ang)*l,sy+Math.sin(ang)*l);x.stroke();
    }
    document.body.style.backgroundImage='url('+c.toDataURL('image/png')+')';
  }catch(e){}
})();

CATS.forEach(function(c,i){
  var a=el('a',{class:'cat p'+(i+1),href:'#'+c.key});
  a.appendChild(el('i',{},pad(i+1)));
  a.appendChild(el('b',{style:'font-weight:400'},c.en));
  home.appendChild(a);
});
var cats=[].slice.call(home.querySelectorAll('.cat'));

/* Language: one small switch, top left. Hebrew keeps the same fonts and drops film titles. */
function applyLang(){
  var t=T[LANG];
  document.documentElement.lang=LANG;
  document.getElementById('tag').textContent=t.tag;
  document.getElementById('coord').innerHTML=t.coord;
  document.getElementById('aboutH').textContent=t.aboutH;
  document.getElementById('figcap').textContent=t.cap;
  document.getElementById('contactH').textContent=t.contactH;
  document.getElementById('waLabel').textContent=t.wa;
  var at=document.getElementById('aboutText');at.textContent='';
  t.text.forEach(function(s){at.appendChild(el('p',{},s))});
  cats.forEach(function(a,i){a.querySelector('b').textContent=nameOf(CATS[i])});
  [].forEach.call(document.querySelectorAll('#lang span'),function(s){s.classList.toggle('on',s.getAttribute('data-l')===LANG)});
  route(true);
}
document.getElementById('lang').addEventListener('click',function(){
  LANG=LANG==='en'?'he':'en';
  try{localStorage.setItem('zehut-lang',LANG)}catch(e){}
  applyLang();
});

/* Motion: categories drift against the pointer at different depths; an ink dot trails the cursor. */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tx=0,ty=0,cx=0,cy=0,mx=-100,my=-100,dx=-100,dy=-100;
window.addEventListener('pointermove',function(e){
  mx=e.clientX;my=e.clientY;
  tx=(e.clientX/window.innerWidth-.5)*2;ty=(e.clientY/window.innerHeight-.5)*2;
  var t=e.target;dot.classList.toggle('big',!!(t&&t.closest&&t.closest('a,button')));
},{passive:true});
document.addEventListener('pointerleave',function(){tx=ty=0;mx=my=-100});
/* Phone: tilting moves the layers (gyroscope); a finger drag works too. iPhone asks once, on the first tap. */
var touch=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches,gyro=false;
function onTilt(e){if(e.gamma==null)return;gyro=true;tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,(e.beta-40)/25))}
function startGyro(){
  try{
    var D=window.DeviceOrientationEvent;if(!D)return;
    if(typeof D.requestPermission==='function'){D.requestPermission().then(function(s){if(s==='granted')window.addEventListener('deviceorientation',onTilt)}).catch(function(){})}
    else window.addEventListener('deviceorientation',onTilt);
  }catch(e){}
}
if(touch){
  try{if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=='function')startGyro()}catch(e){}
  window.addEventListener('touchend',function once(){startGyro();window.removeEventListener('touchend',once)},{passive:true});
  window.addEventListener('touchmove',function(e){if(gyro)return;var t=e.touches[0];tx=(t.clientX/innerWidth-.5)*2;ty=(t.clientY/innerHeight-.5)*2},{passive:true});
  window.addEventListener('touchend',function(){if(!gyro){tx=ty=0}},{passive:true});
}
var mag=cats.map(function(){return {x:0,y:0}});
var sy=0,ssy=0,lastSy=0,scrollVel=0;
window.addEventListener('scroll',function(){sy=window.scrollY||0},{passive:true});
function tick(){
  cx+=(tx-cx)*.06;cy+=(ty-cy)*.06;
  dx+=(mx-dx)*.2;dy+=(my-dy)*.2;
  ssy+=(sy-ssy)*.12;
  scrollVel=scrollVel*.85+(sy-lastSy)*.15;lastSy=sy;
  if(!reduce&&!home.hidden){
    for(var i=0;i<cats.length;i++){
      var a=cats[i],k=DEPTH[i%DEPTH.length]*(touch?30:22);
      var ccx=a.offsetLeft+a.offsetWidth/2,ccy=a.offsetTop+a.offsetHeight/2,ddx=mx-ccx,ddy=my-ccy,d=Math.sqrt(ddx*ddx+ddy*ddy),m=mag[i];
      var pull=(!touch&&d<160)?(1-d/160)*.35:0;
      m.x+=(ddx*pull-m.x)*.15;m.y+=(ddy*pull-m.y)*.15;
      a.style.transform='translate3d('+(-cx*k+m.x).toFixed(2)+'px,'+(-cy*k+m.y).toFixed(2)+'px,0)';
    }
  }
  if(!reduce&&!wall.hidden){
    var tiles=wall.querySelectorAll('.reels.collage .r');
    for(var j=0;j<tiles.length;j++){
      var z=+tiles[j].style.zIndex||1,px=-cx*z*(touch?5:4),py=-cy*z*(touch?5:4)-ssy*(z-2.5)*.035;
      tiles[j].style.setProperty('--px',px.toFixed(2)+'px');tiles[j].style.setProperty('--py',py.toFixed(2)+'px');
    }
  }
  dot.style.transform='translate3d('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px,0)';
  requestAnimationFrame(tick);
}

/* Desktop: a tile tilts toward the cursor like a print lifted off the table. */
wall.addEventListener('pointermove',function(e){
  if(reduce||e.pointerType!=='mouse')return;
  var b=e.target.closest&&e.target.closest('.box');
  wall.querySelectorAll('.box.tilt').forEach(function(x){if(x!==b){x.classList.remove('tilt');x.style.transform=''}});
  if(!b||b.classList.contains('playing'))return;
  var r=b.getBoundingClientRect(),ax=(e.clientX-r.left)/r.width-.5,ay=(e.clientY-r.top)/r.height-.5;
  b.classList.add('tilt');b.style.transform='perspective(900px) rotateY('+(ax*9).toFixed(2)+'deg) rotateX('+(-ay*9).toFixed(2)+'deg) scale(1.02)';
});
wall.addEventListener('pointerleave',function(){wall.querySelectorAll('.box.tilt').forEach(function(x){x.classList.remove('tilt');x.style.transform=''})});

/* A tapped film plays inside its own tile, with sound; starting another stops the first. */
var current=null;
function playInline(box,v){
  stopInline();
  var f=el('iframe',{src:'https://player.vimeo.com/video/'+v.id+'?autoplay=1&playsinline=1&title=0&byline=0&portrait=0&dnt=1',allow:'autoplay; fullscreen; picture-in-picture',title:'film'});
  box.appendChild(f);box.classList.add('playing');current={box:box,f:f};
}
function stopInline(){if(current){current.f.remove();current.box.classList.remove('playing');current=null}}

var THUMBS={};
function loadThumb(id,img){
  img.onload=function(){img.classList.add('in')};
  if(THUMBS[id]){img.src=THUMBS[id];return}
  var backup='https://vumbnail.com/'+id+'.jpg';
  img.onerror=function(){img.onerror=null;img.src=backup};
  fetch('https://vimeo.com/api/oembed.json?url='+encodeURIComponent('https://vimeo.com/'+id)+'&width=720')
    .then(function(r){return r.ok?r.json():null})
    .then(function(d){var u=d&&d.thumbnail_url?d.thumbnail_url:backup;THUMBS[id]=u;img.src=u})
    .catch(function(){img.src=backup});
}

function showWall(c){
  current=null;wall.textContent='';
  var t=T[LANG];
  var head=el('div',{class:'wall-head'});
  head.appendChild(el('h2',{},nameOf(c)));
  head.appendChild(el('span',{},pad(c.videos.length)+t.films));
  head.appendChild(el('a',{class:'back',href:'#'},t.back));
  wall.appendChild(head);
  var grid=el('div',{class:'reels collage'});
  c.videos.forEach(function(v,i){
    var r=el('div',{class:'r'}),box=el('div',{class:'box'});
    var th=el('button',{class:'thumb',type:'button','aria-label':'Play'});
    var img=el('img',{alt:'',decoding:'async'});
    th.appendChild(img);th.appendChild(el('span',{class:'play','aria-hidden':'true'},'▶'));
    th.addEventListener('click',function(){playInline(box,v)});
    box.appendChild(th);loadThumb(v.id,img);
    r.appendChild(box);
    if(v.title&&LANG==='en'){var p=el('p');p.appendChild(el('i',{},pad(i+1)));p.appendChild(document.createTextNode(v.title.toLowerCase()));r.appendChild(p)}
    grid.appendChild(r);
  });
  wall.appendChild(grid);
}

/* Collage slots: left, top and width in % of the wall's width; height follows 9:16. Overlaps are deliberate. */
var SLOTS=[
  {l:3,t:0,w:34,z:2},{l:31,t:30,w:26,z:4},{l:62,t:4,w:30,z:1},
  {l:55,t:50,w:27,z:5},{l:10,t:64,w:29,z:3},{l:68,t:100,w:24,z:2},
  {l:34,t:112,w:27,z:4},{l:4,t:128,w:25,z:1},{l:60,t:150,w:30,z:3}
];
var SLOTS_PHONE=[
  {l:0,t:0,w:50,z:2},{l:46,t:60,w:50,z:3},{l:6,t:140,w:46,z:1},
  {l:50,t:196,w:46,z:4},{l:2,t:270,w:48,z:2},{l:48,t:330,w:48,z:3}
];
function layout(){
  var g=wall.querySelector('.reels.collage');if(!g)return;
  var W=g.clientWidth,phone=W<560,S=phone?SLOTS_PHONE:SLOTS,n=S.length,bottom=0;
  var tiles=g.querySelectorAll('.r');
  for(var i=0;i<tiles.length;i++){
    var s=S[i%n],round=Math.floor(i/n),step=phone?420:190;
    var top=(s.t+round*step)*W/100,w=s.w*W/100,h=w*16/9;
    var r=tiles[i];r.style.left=(s.l*W/100)+'px';r.style.top=top+'px';r.style.width=w+'px';r.style.zIndex=s.z;
    bottom=Math.max(bottom,top+h+40);
  }
  g.style.height=bottom+'px';
}
window.addEventListener('resize',layout);

function route(keep){
  var k=location.hash.slice(1),c=null;
  for(var i=0;i<CATS.length;i++)if(CATS[i].key===k)c=CATS[i];
  var aboutEl=document.getElementById('about'),al=document.getElementById('aboutLink'),isAbout=k==='about',wasAbout=!aboutEl.hidden,t=T[LANG];
  aboutEl.hidden=!isAbout;document.body.classList.toggle('in-about',isAbout);
  al.textContent=isAbout?t.close:t.about;al.setAttribute('href',isAbout?'#':'#about');
  if(isAbout){stopInline();wall.hidden=true;home.hidden=true;document.body.classList.remove('in-wall');if(!wasAbout)window.scrollTo(0,0)}
  else if(c){showWall(c);home.hidden=true;wall.hidden=false;document.body.classList.add('in-wall');layout();if(keep!==true)window.scrollTo(0,0)}
  else{wall.hidden=true;home.hidden=false;document.body.classList.remove('in-wall')}
}
window.addEventListener('hashchange',function(){route()});
applyLang();
requestAnimationFrame(tick);
</script>
